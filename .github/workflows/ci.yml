name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes to the same branch/PR supersede older runs; don't burn minutes
# finishing a run whose commit is already outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    # A stalled step should fail in minutes, not run to the six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dependency audit
        run: npm run audit:ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser binary only, from Playwright's CDN. Deliberately not
      # --with-deps: that shells out to apt-get, which twice hung on the
      # runner's mirror with no output (once for 4h47m) and never reached the
      # download. ubuntu-latest already carries Chromium's system libraries; if
      # one is ever missing, Playwright says which on browser launch, in
      # seconds, instead of hanging.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
